# 本機開發用的 PostgreSQL 與 Redis：
#   docker compose up -d
#
# 以正式環境映像在本機跑 API（先完成上面兩個服務與 .env 設定）：
#   docker compose --profile api up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paddock64
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [api]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/paddock64
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 啟動前先套用資料庫遷移（正式環境由部署平台的 pre-deploy 步驟執行）
    command: ['sh', '-c', 'npx prisma migrate deploy && node dist/main.js']

volumes:
  db-data:
